version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-build:
        update-types: ["minor", "patch"]
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.dokka*"
          - "org.jetbrains.kotlinx.binary-compatibility-validator"
          - "com.gradleup.*"
          - "gradle-wrapper"
          - "io.netty:*"
          - "org.bouncycastle:*"
          - "org.apache.commons:commons-compress"
          - "commons-io:commons-io"
          - "org.jdom:jdom2"
          - "org.bitbucket.b_c:jose4j"
          - "org.freemarker:freemarker"
          - "org.jsoup:jsoup"
          - "com.google.protobuf:*"
          - "com.google.guava:guava"
          - "com.fasterxml.jackson*"
      gradle-runtime:
        update-types: ["minor", "patch"]
        patterns: ["*"]
        exclude-patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.dokka*"
          - "org.jetbrains.kotlinx.binary-compatibility-validator"
          - "com.gradleup.*"
          - "gradle-wrapper"
          - "io.netty:*"
          - "org.bouncycastle:*"
          - "org.apache.commons:commons-compress"
          - "commons-io:commons-io"
          - "org.jdom:jdom2"
          - "org.bitbucket.b_c:jose4j"
          - "org.freemarker:freemarker"
          - "org.jsoup:jsoup"
          - "com.google.protobuf:*"
          - "com.google.guava:guava"
          - "com.fasterxml.jackson*"
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
    # Advisory floors forced in build.gradle.kts: only an advisory moves them, patch updates still come.
    ignore:
      - dependency-name: "io.netty:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.bouncycastle:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.apache.commons:commons-compress"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "commons-io:commons-io"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jdom:jdom2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.bitbucket.b_c:jose4j"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.freemarker:freemarker"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jsoup:jsoup"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.protobuf:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.guava:guava"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.fasterxml.jackson*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Need AGP 9 and compileSdk 37: remove with the AGP 9 migration.
      - dependency-name: "androidx.compose:compose-bom"
        versions: ["[2026.08.00,)"]
      - dependency-name: "androidx.core:core-ktx"
        versions: ["[1.19.0,)"]
      - dependency-name: "androidx.lifecycle:*"
        versions: ["[2.11.0,)"]
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Merchants inherit these: a major is a decision, not an update.
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
