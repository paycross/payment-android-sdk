name: Reference

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the reference to, e.g. v0.8.1'
        required: true
        type: string
      ref:
        description: 'Source to build from. Leave empty to build the tag itself.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reference:
    name: Build and attach the Dokka reference
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # A tag without a Dokka task needs `ref: main`, which only matches the tag if main's public API still does.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the documentation
        run: ./gradlew :sdk:dokkaGeneratePublicationHtml

      - name: Package
        run: |
          set -euo pipefail
          # index.html must sit at the archive root for the portal to unzip it.
          (cd sdk/build/dokka/html && zip -qr "$GITHUB_WORKSPACE/paycross-android-reference.zip" .)
          ls -l paycross-android-reference.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md" || true
          gh release upload "$TAG" paycross-android-reference.zip --clobber

      - name: The asset carries the entry point and no module internals
        run: |
          set -euo pipefail
          # Listed to a file: grep -q exits early and the SIGPIPE fails pipefail.
          unzip -Z1 paycross-android-reference.zip > "$RUNNER_TEMP/listing.txt"
          grep -qx 'index.html' "$RUNNER_TEMP/listing.txt"
          # Kotlin `internal` visibility and perPackageOption in sdk/build.gradle.kts keep the internal package out.
          if grep -q 'com\.paycross\.sdk\.internal' "$RUNNER_TEMP/listing.txt"; then
            echo "::error::internal packages leaked into the published reference"
            exit 1
          fi
