name: Publish

# A tag is what merchants and the Flutter plugin resolve against, so cutting one
# has to actually produce an artifact. Without this the version exists in git and
# nowhere else, which is the state that made the SDK unconsumable to begin with.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Refuse anything that is not a plain semver, so a mistyped tag cannot
          # publish a coordinate nobody can resolve.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publishing an untested artifact is worse than publishing none: it cannot
      # be withdrawn once a merchant has resolved it.
      - name: Test before publishing
        run: ./gradlew :sdk:testDebugUnitTest :sdk:lintRelease

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository \
            -PpaycrossVersion=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Published \`com.paycross:sdk:${{ steps.version.outputs.version }}\`"
            echo
            echo 'Consumers add the GitHub Packages repository and authenticate with a'
            echo 'token carrying `read:packages`:'
            echo
            echo '```kotlin'
            echo 'maven {'
            echo '    url = uri("https://maven.pkg.github.com/paycross/payment-android-sdk")'
            echo '    credentials {'
            echo '        username = providers.gradleProperty("gpr.user").orNull'
            echo '        password = providers.gradleProperty("gpr.token").orNull'
            echo '    }'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
