name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    environment: maven-central
    runs-on: ubuntu-latest
    # Job-level because the secrets context is not allowed in a step-level if.
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test before publishing
        run: ./gradlew :sdk:testDebugUnitTest :sdk:lintRelease

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository \
            -PpaycrossVersion=${{ steps.version.outputs.version }}

      - name: Upload to Maven Central
        if: ${{ env.CENTRAL_TOKEN_USERNAME != '' }}
        env:
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAggregationToCentralPortal \
            -PpaycrossVersion=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Published \`com.pay-cross:paycross-android:${{ steps.version.outputs.version }}\`"
            echo
            echo 'Published to Maven Central: the upload is AUTOMATIC, so a tag that'
            echo 'passes validation releases without a Portal click. Central artifacts are'
            echo 'permanent - a bad release is fixed by the next version, never by'
            echo 'unpublishing. Merchants need no repository config:'
            echo
            echo '```kotlin'
            echo 'implementation("com.pay-cross:paycross-android:${{ steps.version.outputs.version }}")'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
