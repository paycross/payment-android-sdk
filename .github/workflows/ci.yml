name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        run: ./gradlew :sdk:assembleRelease

      - name: Unit tests
        run: ./gradlew :sdk:testDebugUnitTest

      - name: Lint
        run: ./gradlew :sdk:lintRelease

      # Publishing to GitHub Packages needs credentials; the local repo catches the same config errors.
      - name: Publication resolves
        run: ./gradlew :sdk:publishToMavenLocal -PpaycrossVersion=0.0.0-ci

      - name: Upload AAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-aar
          path: sdk/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            sdk/build/reports/tests/**
            sdk/build/reports/lint-results-*.html
          if-no-files-found: warn

  # Only automated check that the hidden 3DS fingerprint WebView runs; it renders at 1dp and alpha 0.
  instrumented:
    name: Instrumented (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The runner image ships KVM but not the permissions for it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :sdk:connectedDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report
          path: sdk/build/reports/androidTests/**
          if-no-files-found: warn

  # Checks consumer-visible properties that the build does not fail on.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Once published, the public ABI must keep resolving; apiCheck guards it.
      - name: Public ABI matches the committed dump
        run: ./gradlew :sdk:apiCheck

      # Test identifiers are a merchant-facing contract shared with iOS; each must be attached.
      - name: Every test identifier is attached to an element
        run: |
          set -euo pipefail
          status=0
          tags=sdk/src/main/kotlin/com/paycross/sdk/internal/ui/TestTags.kt
          names=$(grep -oE 'const val [A-Z_]+' "$tags" | awk '{print $3}')
          # Guards against the loop running zero times when the file moves.
          count=$(echo "$names" | grep -c . || true)
          if [ "$count" -lt 20 ]; then
            echo "::error::found $count identifiers in $tags, expected at least 20 - has it moved?"
            exit 1
          fi
          for name in $names; do
            # Excludes the declaring file, whose KDoc mentions would otherwise count.
            if ! grep -rq "TestTags\.$name\b" sdk/src/main/kotlin \
                 --include='*.kt' --exclude=TestTags.kt; then
              echo "::error::TestTags.$name is declared but attached to nothing"
              status=1
            fi
          done
          exit $status

      # Types in public signatures need `api`, or external modules cannot use them.
      - name: Types in the public API are exposed with `api`
        run: |
          set -euo pipefail
          status=0
          for dep in androidx.activity:activity-compose androidx.annotation:annotation; do
            if ! grep -qE "^\s*api\(\"$dep" sdk/build.gradle.kts; then
              echo "::error::$dep appears in the public API and must be declared with api(), not implementation()"
              status=1
            fi
          done
          exit $status

      # Central verifies the pay-cross.com namespace; the groupId cannot change once published.
      - name: Maven coordinate matches the verifiable namespace
        run: |
          set -euo pipefail
          status=0
          grep -q '^group = "com\.pay-cross"$' sdk/build.gradle.kts || {
            echo "::error::groupId must be com.pay-cross - com.paycross cannot be verified, paycross.com belongs to someone else"
            status=1
          }
          grep -q 'artifactId = "paycross-android"' sdk/build.gradle.kts || {
            echo "::error::artifactId must be paycross-android"
            status=1
          }
          for block in licenses developers scm; do
            grep -q "$block {" sdk/build.gradle.kts || {
              echo "::error::pom is missing the $block block, which Maven Central requires"
              status=1
            }
          done
          exit $status

      - name: No card data may reach disk or logs
        run: |
          set -euo pipefail
          if find sdk/src/main -name '*.kt' -exec sed -E 's://.*::' {} + \
             | grep -nE 'SharedPreferences|HttpLoggingInterceptor|getExternalFilesDir|MediaStore'; then
            echo "::error::persistence or request-logging API referenced in SDK sources"
            exit 1
          fi
          echo "ok"

      # A launchMode or taskAffinity would move PaymentActivity into its own task and lose its results.
      - name: PaymentActivity stays in the caller's task
        run: |
          set -euo pipefail
          if grep -nE 'launchMode|taskAffinity' sdk/src/main/AndroidManifest.xml; then
            echo "::error::PaymentActivity must launch into the caller's task or results are lost"
            exit 1
          fi
          if grep -rnE 'FLAG_ACTIVITY_NEW_TASK' sdk/src/main/kotlin; then
            echo "::error::FLAG_ACTIVITY_NEW_TASK breaks startActivityForResult"
            exit 1
          fi
          echo "ok"
