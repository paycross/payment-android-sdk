org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Longer daemon and connection timeouts, for builds on a virtualised filesystem.
org.gradle.daemon.idletimeout=180000
org.gradle.internal.remote.connect.timeout=180000

# Release coordinate for :sdk. The publish workflow overrides this with
# -PpaycrossVersion=<tag>, so the git tag stays authoritative for what is
# actually uploaded; this is the version local and CI builds carry.
paycrossVersion=0.8.1
