org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Virtualised filesystems need longer daemon and connection timeouts.
org.gradle.daemon.idletimeout=180000
org.gradle.internal.remote.connect.timeout=180000

# CI overrides this with -PpaycrossVersion=<tag>; the git tag is what gets published.
paycrossVersion=0.8.5
